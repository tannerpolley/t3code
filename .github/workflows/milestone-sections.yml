name: Milestone sections

# One-shot: applies the standing-section milestone plan when this file lands on
# main. Safe to rerun; delete this file once the run succeeds.
on:
  push:
    branches: [main]
    paths: [.github/workflows/milestone-sections.yml]
  workflow_dispatch:

permissions:
  issues: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Apply sections
        run: |
          set -euo pipefail
          number() { gh api "repos/$GH_REPO/milestones?state=all&per_page=100" --jq ".[] | select(.title == \"$1\") | .number"; }
          # section <title> <old title or -> <description>: rename or create, and keep open
          section() {
            n=$(number "$1"); [ -n "$n" ] || n=$(number "$2")
            if [ -n "$n" ]; then gh api -X PATCH "repos/$GH_REPO/milestones/$n" -f title="$1" -f state=open -f description="$3" >/dev/null
            else gh api "repos/$GH_REPO/milestones" -f title="$1" -f description="$3" >/dev/null; fi
            echo "section: $1"
          }
          move() { gh issue edit "$1" --milestone "$2" >/dev/null; echo "#$1 -> $2"; }
          section "Upstream Sync" "01 - Upstream sync" "Keeping the fork on upstream T3 Code: rebases, merge conflicts, patches/, and moving fork code out of upstream files. Excludes new features."
          section "Sidebar and Threads" "02 - Sidebar and threads" "Sidebar organization, thread rows, roles, lineage, background work, and worker visibility. Excludes usage data and chat content."
          section "Issues and Orchestration" "03 - Issues and agent orchestration" "In-app GitHub Issues, the roadmap view, and driving agent work from issues: apps/server/src/issues, orchestration-v2, mcp, and docs/orchestration-v2."
          section "Browser and Preview" "05 - Browser and preview" "In-app browser panel, local server discovery, and preview tooling: apps/web/src/browser, apps/server/src/preview, apps/desktop/src/preview."
          section "Providers and Usage" "06 - Providers and usage" "Provider parity across Codex, Claude, and others, provider switching, and usage and rate-limit readouts: packages/provider-*, apps/server/src/provider and usage."
          section "Chat, Terminal and Workspaces" "07 - Chat, terminal and workspaces" "Chat rendering, the composer, the terminal, worktrees, and project folders: apps/web composer, markdown and terminal code, apps/server/src/terminal and workspace."
          section "Tooling" "04 - Fork maintenance" "Git, build, release, dev-server, CI, and roadmap housekeeping for the fork: scripts/, packaging/, .github, and lint config. Excludes product features."
          move 25 "Sidebar and Threads"
          move 10 "Sidebar and Threads"
          move 13 "Issues and Orchestration"
          move 24 "Upstream Sync"
          gh issue edit 1 --title "Personal fork roadmap and maintenance tracker" >/dev/null
          gh api "repos/$GH_REPO/milestones?state=all&per_page=100" --jq '.[] | "\(.state)\t\(.open_issues) open\t\(.title)"'
